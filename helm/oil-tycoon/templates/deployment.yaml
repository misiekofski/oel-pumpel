apiVersion: apps/v1
kind: Deployment
metadata:
  name: oil-tycoon
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: oil-tycoon
  template:
    metadata:
      labels:
        app: oil-tycoon
    spec:
      containers:
        - name: oil-tycoon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
